; Generated for the recurringwakeup FreePBX module
[recurringwakeup-answer]
exten => s,1,NoOp(Recurring Wakeup job=${RW_JOB_ID} queue=${RW_QUEUE_ID} attempt=${RW_ATTEMPT})
 same => n,Set(RW_RESULT_HANDLED=0)
 same => n,Answer()
 same => n,Set(CHANNEL(language)=de)
 same => n,Playback(recurringwakeup/wakeup)
 same => n,Read(WAKEKEY,recurringwakeup/options,1,,2,10)
 same => n,GotoIf($["${WAKEKEY}"="1"]?confirmed)
 same => n,GotoIf($["${WAKEKEY}"="5"]?snooze)
 same => n,Set(RW_RESULT_HANDLED=1)
 same => n,AGI(recurringwakeup_agi.php,${RW_JOB_ID},${RW_QUEUE_ID},${RW_ATTEMPT},noinput)
 same => n,Playback(recurringwakeup/noinput)
 same => n,Hangup()
 same => n(confirmed),Set(RW_RESULT_HANDLED=1)
 same => n,AGI(recurringwakeup_agi.php,${RW_JOB_ID},${RW_QUEUE_ID},${RW_ATTEMPT},confirmed)
 same => n,Playback(recurringwakeup/confirmed)
 same => n,Hangup()
 same => n(snooze),Set(RW_RESULT_HANDLED=1)
 same => n,AGI(recurringwakeup_agi.php,${RW_JOB_ID},${RW_QUEUE_ID},${RW_ATTEMPT},snooze)
 same => n,Playback(recurringwakeup/snooze)
 same => n,Hangup()

; If the called party hangs up before pressing 1 or 5, schedule a retry.
exten => h,1,NoOp(Recurring Wakeup hangup handler handled=${RW_RESULT_HANDLED})
 same => n,GotoIf($["${RW_RESULT_HANDLED}"="1"]?done)
 same => n,System(/usr/bin/php /var/lib/asterisk/agi-bin/recurringwakeup_agi.php ${RW_JOB_ID} ${RW_QUEUE_ID} ${RW_ATTEMPT} hangup >/dev/null 2>&1)
 same => n(done),NoOp(Recurring Wakeup hangup handler finished)
